version: v0.4
project:
  name: Word-Certificate Density for Collatz Hitting Times (Phase 1)
  description: A Lean 4 extraction of eighteen selected Phase 1 statements on lower natural density for
    ordinary Collatz hitting times, exact finite fan allocation and real-moment comparison, profile density
    for canonical and admissible targets, and bounded actual reference entropy with explicit tail and
    zero normalized growth. The baseline includes the exact target criterion, individual-root consequence,
    vanishing-clock-loss variants and accepted depth-eleven formulas. Density witnesses and levels are
    existential. Full optimized formulas, complementary capacity, the Renyi-order right limit, amplified
    roots and pointwise Collatz convergence are outside scope.
