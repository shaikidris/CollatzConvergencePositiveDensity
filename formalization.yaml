status:
  scope: Eighteen selected statements. The original eleven mathematical statements are preserved under
    public renaming. Seven companions expose the actual geometric reference law, full-group fan, exact
    profile, actual residual and complete local mixing recipe. Profiles cover exact allocation/hinge identity,
    each real-moment lower bound and existential paid-level density for canonical and admissible targets.
    Entropy covers positive-index increments, a finite monotone limit with explicit tail, and zero normalized
    growth and positive-index infimum. No complementary-capacity comparison, Renyi-order right limit,
    deeper certificate, optimized recipe or amplified-root family is claimed.
