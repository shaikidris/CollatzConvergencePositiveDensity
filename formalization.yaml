fidelity:
  divergences: The baseline mathematical statements are preserved under descriptive public renaming; the
    main density quantifiers are written directly. Their depth-eleven formulas match production closed
    forms; the original fractional statements use an existential p satisfying W/2 < p <= W, witnessed
    by the actual residual. The individual-root statement omits seed-pool membership and score details.
    The seven new companions expose the actual law and exact mixing recipe and identify them by structural
    equivalence proofs. Profile density specializes the fixed-level paper theorem to one existential positive
    paid residual before all clocks, for convergence to one or each admissible target. Entropy uses the
    full compact-envelope tail, which implies the printed power-tail bound; the zero-rate infimum uses
    positive normalized indices. The Renyi-order right limit and complementary-capacity branch are not
    selected. Deeper tables, full optimizers, coefficient-size comparisons and Appendix C amplification
    remain outside this release.
